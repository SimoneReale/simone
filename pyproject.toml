[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dreamq-pgk2"
version = "0.1.0"
description = "Leakage-aware classical molecular hit prediction for DREAM-Q PGK2"
requires-python = ">=3.11"
dependencies = [
  "rdkit>=2023.9", "numpy>=1.26", "pandas>=2.1", "scipy>=1.11",
  "scikit-learn>=1.4", "torch>=2.2", "joblib>=1.3", "PyYAML>=6",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
test = ["pytest>=8"]
trees = ["xgboost-cpu>=2.1; platform_system == 'Linux'", "xgboost>=2.1; platform_system != 'Linux'", "lightgbm>=4.0"]
graph = ["chemprop>=2.3.1,<2.4"]
chemprop = ["chemprop>=2.3.1,<2.4"]

[project.scripts]
dreamq = "dreamq.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
